[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = 'flaire'
authors = [
    {name = 'josep sanz', email = 'jsanz83@gmail.com'}
]
description = 'Flaire aims to be more than just a scraper; it wants to be a price-monitoring tool for perfumes to detect interesting deals.'

license = {file = 'LICENSE.txt'}
keywords = ['flaire']
requires-python = '>=3.13'

dependencies = [
  "alembic>=1.16.4",
  'botasaurus>=4.0.88',
  "colorama>=0.4.6",
  "fastapi[standard]>=0.117.1",
  'pandas>=2.3.1',
  'PyYAML>=6.0.2',
  "sqladmin[full]>=0.21.0",
  "sqlalchemy>=2.0.43",
  "streamlit>=1.49.1",
  "uvicorn>=0.36.0",
]

dynamic = ['version', 'readme']

[project.optional-dependencies]
dev = [
  "pytest",
]

# Packaging: Setuptools
#
[tool.setuptools.dynamic]
version = {attr = 'flaire._version.__version__'}
readme = {file = ['README.md']}

[tool.setuptools.packages.find]
where = ['src']
#include = ['*']
namespaces = true

# Linter: Ruff
#
[tool.ruff.lint]
ignore = ['E501', 'E722']

[tool.ruff.lint.per-file-ignores]
'flaire/__init__.py' = ['F401']
